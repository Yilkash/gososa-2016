<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GOSOSA Set 2016 Flyer</title>
<meta name="description" content="Make your 'I will be present' flyer for the GOSOSA Set 2016 10th anniversary reunion, 20–22 November 2026.">
<meta name="theme-color" content="#0b1a13">
<link rel="icon" href="img/logo.png">
<meta property="og:title" content="GOSOSA Set 2016 · Make your flyer">
<meta property="og:description" content="Upload your photo, type your name, download your 'I will be present' flyer. 20–22 November 2026.">
<meta property="og:url" content="https://yilkash.github.io/gososa-2016/">
<meta name="twitter:card" content="summary_large_image">
<meta property="og:image" content="https://yilkash.github.io/gososa-2016/img/og.jpg">
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/t-gold.css">
<link rel="stylesheet" href="css/t-navy.css">
</head>
<body>
<header class="bar">
  <a class="brand" href="./">
    <img src="img/logo.png" alt="" width="34" height="34">
    <span>GOSOSA <em>Set 2016</em></span>
  </a>
  <span class="when">20–22 Nov 2026</span>
</header>

<main class="layout">
  <section class="preview">
    <div class="stage" id="stage"><div class="scaler" id="scaler"></div></div>
    <div class="adjust" id="adjust" hidden>
      <span>Drag to move</span>
      <label class="zoom"><span>Zoom</span><input type="range" id="zoom" min="1" max="3" step="0.01" value="1"></label>
      <button class="text-btn" id="reset" type="button">Reset</button>
    </div>
  </section>

  <section class="panel">
    <p class="eyebrow">10th anniversary reunion</p>
    <h1>Ten years on.<br>Let them know you'll be there.</h1>

    <div class="field">
      <span class="label">Design</span>
      <div class="designs" id="designs"></div>
    </div>

    <div class="field">
      <span class="label">Photo</span>
      <label class="upload">
        <input type="file" id="photo" accept="image/*" hidden>
        <span id="photo-label">Upload a photo</span>
        <small>Waist up, facing the camera works best</small>
      </label>
    </div>

    <div class="field">
      <label class="label" for="name">Name on the flyer</label>
      <input type="text" id="name" maxlength="32" placeholder="Your full name" autocomplete="name">
    </div>

    <div class="actions">
      <button class="btn primary" id="download" type="button">Download flyer</button>
      <button class="btn ghost" id="share" type="button" hidden>Share to WhatsApp</button>
    </div>
    <p class="status" id="status" role="status"></p>

    <p class="note">Your photo is processed on your device and is never uploaded.</p>
  </section>
</main>

<footer class="foot">Good Shepherd Old Students' Association · Arise and Shine</footer>

<script src="vendor/html-to-image.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
