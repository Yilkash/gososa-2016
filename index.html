<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GOSOSA Set 2016 Flyer</title>
<meta name="description" content="Make your 'I will be present' flyer for the GOSOSA Set 2016 10th anniversary reunion, 20–22 November 2026.">
<meta name="theme-color" content="#0f2a1e">
<link rel="icon" href="img/logo.png">
<meta property="og:title" content="GOSOSA Set 2016 · Make your flyer">
<meta property="og:description" content="Upload your photo, type your name, download your 'I will be present' flyer. 20–22 November 2026.">
<meta property="og:url" content="https://yilkash.github.io/gososa-2016/">
<meta name="twitter:card" content="summary_large_image">
<meta property="og:image" content="https://yilkash.github.io/gososa-2016/img/og.jpg">
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/t-gold.css">
<link rel="stylesheet" href="css/t-navy.css">
</head>
<body>
<header class="top">
  <img src="img/logo.png" alt="GOSOSA logo" width="56" height="56">
  <div>
    <h1>GOSOSA Set 2016</h1>
    <p>10th Anniversary · 20–22 Nov 2026</p>
  </div>
</header>

<main class="layout">
  <section class="controls">
    <div class="step">
      <h2><span>1</span> Pick a design</h2>
      <div class="designs" id="designs"></div>
    </div>

    <div class="step">
      <h2><span>2</span> Add your photo</h2>
      <label class="btn btn-photo">
        <input type="file" id="photo" accept="image/*" hidden>
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M9 3 7.2 5H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-3.2L15 3H9zm3 5a5 5 0 1 1 0 10 5 5 0 0 1 0-10zm0 2a3 3 0 1 0 0 6 3 3 0 0 0 0-6z"/></svg>
        <span id="photo-label">Choose photo</span>
      </label>
    </div>

    <div class="step">
      <h2><span>3</span> Type your name</h2>
      <input type="text" id="name" maxlength="32" placeholder="e.g. Dimka Yilrit" autocomplete="name">
    </div>
  </section>

  <section class="preview">
    <div class="stage" id="stage"><div class="scaler" id="scaler"></div></div>
    <div class="adjust" id="adjust" hidden>
      <span class="hint">Drag the photo to move it</span>
      <label class="zoom">Zoom <input type="range" id="zoom" min="1" max="3" step="0.01" value="1"></label>
      <button class="link" id="reset" type="button">Reset</button>
    </div>
    <div class="actions">
      <button class="btn btn-main" id="download" type="button">Download flyer</button>
      <button class="btn btn-wa" id="share" type="button" hidden>Share to WhatsApp</button>
    </div>
    <p class="status" id="status" role="status"></p>
  </section>
</main>

<footer class="foot">
  <p>Good Shepherd Old Students' Association · Arise and Shine</p>
</footer>

<script src="vendor/html-to-image.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
