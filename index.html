<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GOSOSA Set 2016 Flyer</title>
<meta name="description" content="Make your 'I will be present' flyer for the GOSOSA Set 2016 10th anniversary reunion, 20–22 November 2026.">
<meta name="theme-color" content="#0f2a1e">
<link rel="icon" href="img/logo.png">
<meta property="og:title" content="GOSOSA Set 2016 · Make your flyer">
<meta property="og:description" content="Upload your photo, type your name, download your 'I will be present' flyer. 20–22 November 2026.">
<meta property="og:url" content="https://yilkash.github.io/gososa-2016/">
<meta name="twitter:card" content="summary_large_image">
<meta property="og:image" content="https://yilkash.github.io/gososa-2016/img/og.jpg">
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/t-gold.css">
<link rel="stylesheet" href="css/t-navy.css">
<link rel="stylesheet" href="css/t-bold.css">
</head>
<body>
<header class="site-top">
  <img src="img/logo.png" alt="GOSOSA logo" width="56" height="56">
  <div>
    <h1>GOSOSA Set 2016</h1>
    <p>10th Anniversary · 20–22 Nov 2026</p>
  </div>
</header>

<main class="layout">
  <section class="controls">
    <div class="step">
      <h2>Design</h2>
      <div class="designs" id="designs"></div>
    </div>

    <div class="step">
      <h2>Photo</h2>
      <label class="btn btn-photo">
        <input type="file" id="photo" accept="image/*" hidden>
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M9 3 7.2 5H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-3.2L15 3H9zm3 5a5 5 0 1 1 0 10 5 5 0 0 1 0-10zm0 2a3 3 0 1 0 0 6 3 3 0 0 0 0-6z"/></svg>
        <span id="photo-label">Upload photo</span>
      </label>
    </div>

    <div class="step">
      <h2>Name</h2>
      <input type="text" id="name" maxlength="32" placeholder="Your full name" autocomplete="name">
    </div>
  </section>

  <section class="preview">
    <div class="stage" id="stage"><div class="scaler" id="scaler"></div></div>
    <div class="adjust" id="adjust" hidden>
      <span class="hint">Drag photo to move</span>
      <label class="zoom">Zoom <input type="range" id="zoom" min="1" max="3" step="0.01" value="1"></label>
      <button class="link" id="reset" type="button">Reset</button>
    </div>
    <div class="actions">
      <button class="btn btn-main" id="download" type="button">Download flyer</button>
      <button class="btn btn-wa" id="share" type="button" hidden><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52s.198-.298.298-.497c.099-.198.05-.371-.025-.52s-.669-1.612-.916-2.207c-.242-.579-.487-.5-.669-.51a13 13 0 0 0-.57-.01c-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074s2.096 3.2 5.077 4.487c.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413s.248-1.289.173-1.413c-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 0 1-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 0 1-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.82 9.82 0 0 1 2.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.82 11.82 0 0 0 12.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.9 11.9 0 0 0 5.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.82 11.82 0 0 0-3.48-8.413"/></svg><span>WhatsApp</span></button>
    </div>
    <p class="status" id="status" role="status"></p>
  </section>
</main>

<footer class="site-foot">
  <p>Good Shepherd Old Students' Association · Arise and Shine</p>
</footer>

<script src="vendor/html-to-image.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
